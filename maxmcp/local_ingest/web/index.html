<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARTOKE Motion</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="panel" aria-labelledby="page-title">
        <p class="eyebrow">ARTOKE / MOTION</p>
        <h1 id="page-title">영상 하나로 모션을 만드세요</h1>
        <p class="description">영상은 이 PC에서만 분석하고, 완성된 모션만 ARTOKE에 저장합니다.</p>
        <p class="limits">MP4 · MOV · AVI / 최대 5분 / 최대 2GB</p>
        <div class="actions">
          <input id="source" class="visually-hidden" type="file" accept=".mp4,.mov,.avi,video/mp4,video/quicktime,video/x-msvideo">
          <label id="select-action" class="primary-action" for="source">영상 선택하고 시작</label>
          <button id="cancel-action" class="secondary-action" type="button">취소하고 닫기</button>
        </div>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
        <p id="status" class="status" role="status" aria-live="polite">영상을 선택해 주세요.</p>
      </section>
    </main>
  </body>
</html>
