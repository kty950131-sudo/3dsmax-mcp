<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BVH Studio — 구조 목업 (디자인 전)</title>
<style>
/* ------------------------------------------------------------------
   이 스타일시트는 자리표시자다. 피그마 디자인이 확정되면 통째로 교체한다.
   일부러 중립적으로 뒀다 — 배치와 상태만 보이면 된다.
   app.js 가 찾는 선택자(.clip-card, [data-action] 등)는 유지해야 한다.
   ------------------------------------------------------------------ */
:root {
  --bg: #1e1e20;
  --panel: #26262a;
  --line: #37373d;
  --text: #e4e4e8;
  --dim: #8e8e98;
  --accent: #f08c3c;
  --pose: #48a9c5;
  /* 이 PC 에만 있는 클립. --pose 청록과 헷갈리지 않게 확실한 파랑으로 둔다. */
  --local: #5b8dfa;
  --gap: 12px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
  height: 100vh;
  display: grid;
  grid-template-rows: auto auto 1fr auto auto;
  gap: var(--gap);
  padding: var(--gap);
}

/* 상단 바 */
.topbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.topbar input[type="text"] { flex: 0 1 auto; }

/* 필터 줄 — 선반 칩과 검색. 동작 버튼과 섞지 않는다.
   칩이 세 줄로 늘어나므로 검색 칸은 가운데가 아니라 위에 맞춘다. */
.filterbar { display: flex; gap: 8px; align-items: flex-start; }
.shelf-chips { display: flex; flex-direction: column; gap: 5px; flex: 1 1 auto; min-width: 0; }
.cat-bar { display: flex; gap: 6px; flex: 1 1 auto; flex-wrap: wrap; min-width: 0; }
/* 아래 줄일수록 들여쓰고 작게. 세 줄이 같은 무게면 어느 것이 어느 것의 하위인지
   읽을 때마다 다시 따져야 한다. */
.cat-bar.is-sub { padding-left: 4px; }
.cat-bar.is-detail { padding-left: 16px; }
.cat-bar.is-sub .cat-chip,
.cat-bar.is-detail .cat-chip { padding: 3px 9px; font-size: 12px; }
.cat-bar[hidden] { display: none; }
.cat-chip {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--dim);
  padding: 4px 11px;
  border-radius: 999px;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: color 160ms cubic-bezier(0, 0, 0.2, 1),
              border-color 160ms cubic-bezier(0, 0, 0.2, 1);
}
.cat-chip:hover { color: var(--text); border-color: var(--dim); }
.cat-chip .n { color: var(--dim); margin-left: 5px; font-size: 11px; }
.cat-chip.is-on { background: var(--pose); border-color: var(--pose); color: #0d1418; font-weight: 600; }
.cat-chip.is-on .n { color: #0d1418; opacity: .72; }
/* 클립이 아직 없는 선반. 지우지 않고 점선으로 둔다 — 사이트와 같은 이유로,
   빈자리가 다음에 만들 클립을 가리킨다. 있는 것만 보이면 라이브러리가 다 찬
   것처럼 보인다. */
.cat-chip.is-empty { border-style: dashed; color: #5a5a63; }
.cat-chip.is-empty:hover { color: var(--dim); border-color: var(--dim); }

input[type="text"], input[type="number"], select {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 5px 8px;
  border-radius: 4px;
  font: inherit;
}
/* 폴더 칸 + 최근 목록. 목록은 입력칸 아래에 떠야 해서 감싸는 쪽이 기준이 된다. */
.folder-field { position: relative; display: flex; flex: 1 1 320px; min-width: 200px; }
.folder-field input[data-field="folder"] { flex: 1 1 auto; min-width: 0; border-radius: 4px 0 0 4px; }
.folder-drop { border-radius: 0 4px 4px 0; padding: 0 9px; margin-left: -1px; }
.folder-list {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
  background: #2c2c31; border: 1px solid var(--line); border-radius: 5px;
  padding: 4px; max-height: 240px; overflow-y: auto;
  box-shadow: 0 8px 20px rgba(0,0,0,.45);
}
.folder-list[hidden] { display: none; }
.folder-list button {
  display: block; width: 100%; text-align: left; background: transparent;
  border: 0; color: var(--text); padding: 5px 8px; border-radius: 3px;
  font: inherit; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.folder-list button:hover { background: #37373d; }
.folder-list .empty { color: var(--dim); padding: 5px 8px; }
input[data-field="search"] { flex: 0 1 180px; }

/* 8방향 블렌드. 위쪽 임포트 설정을 공유하므로 같은 카드 안에 두되, 선 하나로
   "고른 클립을 넣는 것"과 "없는 방향을 만들어 넣는 것"을 구분한다. */
.blend-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.blend-head { font-size: 11px; color: var(--dim); margin-bottom: 6px; }
.blend-block output { flex: 0 0 84px; text-align: right; font-variant-numeric: tabular-nums; }
.blend-block input[type="range"] { flex: 1 1 auto; }
.blend-note { margin: 8px 0 0; font-size: 11px; color: var(--dim); }

button {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 5px 12px;
  border-radius: 4px;
  font: inherit;
  cursor: pointer;
}
button:hover { border-color: var(--dim); }
button.primary { background: var(--accent); border-color: var(--accent); color: #1a1a1a; font-weight: 600; }
button.video-add { min-height: 44px; border-radius: 2px; }

.video-job-card {
  display: none; align-items: center; gap: 10px; padding: 8px 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
}
.video-job-card.is-visible { display: flex; }
.video-job-copy { flex: 1; min-width: 180px; }
.video-job-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.video-progress { height: 4px; margin-top: 5px; background: #161619; border-radius: 2px; overflow: hidden; }
.video-progress > span { display: block; width: 0; height: 100%; background: var(--pose); transition: width .2s ease; }
.video-job-state { color: var(--pose); font-size: 11px; }

label.check { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; }

/* 본문 2단 */
.body { display: grid; grid-template-columns: 1fr 420px; gap: var(--gap); min-height: 0; }

/* 클립 그리드 — 사이트(viewer)와 같은 대분류→소분류 선반으로 그룹핑한다.
   분류는 Artoke 동기화가 남긴 artoke-manifest.json 에서 오고, 로컬 생성분은
   맨 아래 "미분류" 로 모인다. */
.clip-grid {
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow-y: auto;
  padding: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.clip-group-label {
  margin: 0 0 6px;
  font-size: 10px;
  letter-spacing: .14em;
  color: var(--pose);
  text-transform: uppercase;
}
.clip-group-label .ko { color: var(--dim); letter-spacing: 0; text-transform: none; margin-left: 6px; }
.clip-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: 10px;
}
.clip-card {
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 6px;
  cursor: pointer;
  background: #2c2c31;
}
.clip-card:hover { border-color: var(--dim); }
.clip-card.is-selected { border-color: var(--accent); }
.clip-card canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 3px; background: #232326; }
.clip-card .name { margin-top: 5px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip-card .tags { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clip-card.is-broken { opacity: .45; cursor: not-allowed; }
.clip-card.is-broken .name::after { content: " ⚠"; }

/* 하이브리드 썸네일: Max 배치가 찍은 PNG 가 있는 카드와 계산 썸네일 카드가 섞인다.
   디자인할 때 두 상태가 다 존재한다는 걸 염두에 둘 것. */
.clip-card { position: relative; }
.clip-card.is-rendered .thumb-badge {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,.6); color: var(--accent);
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
}
.clip-card .thumb-badge { display: none; }
.clip-card.is-rendered .thumb-badge { display: block; }

/* 로컬 전용 클립 — 사이트에서 가져온 것이 아니라 이 PC 에만 있다. 지우면
   되돌릴 곳이 없고 동기화가 다시 받아 주지도 않으므로 눈에 띄어야 한다.
   MAX 배지는 오른쪽 위라 이쪽은 왼쪽 위에 둔다. */
.clip-card.is-local { border-color: var(--local); }
/* 선택이 로컬 테두리를 이긴다 — 지금 고른 것이 어느 카드인지가 먼저다.
   배지는 그대로 남아서 로컬이라는 사실은 선택 중에도 사라지지 않는다. */
.clip-card.is-local.is-selected { border-color: var(--accent); }
.clip-card .local-badge {
  display: none;
  position: absolute; top: 10px; left: 10px;
  background: rgba(0,0,0,.6); color: var(--local);
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
}
.clip-card.is-local .local-badge { display: block; }

/* 우측 패널 */
/* 오른쪽 열은 창보다 길어질 수 있다 — 프리뷰·임포트·임포트 후가 세로로 쌓인다.
   넘치는 걸 그냥 두면 맨 아래 "임포트 후" 가 창 밖으로 잘려서 바이패드를
   고를 수가 없다. 스크롤을 주고 프리뷰는 최소 높이 밑으로 안 줄어들게 한다. */
.side { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
.card h2 { margin: 0 0 8px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: .04em; }
.row { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; }
.row > label:first-child { flex: 0 0 68px; color: var(--dim); }
.row > input, .row > select { flex: 1 1 auto; min-width: 0; }

/* 뷰포트는 남는 세로 공간을 전부 먹는다. 아래 카드들은 고정 높이라 안 밀린다. */
.card.preview { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 240px; }
.preview canvas { width: 100%; flex: 1 1 auto; min-height: 0; display: block; border-radius: 4px; background: #232326; }
.preview-bar { display: flex; gap: 6px; margin-top: 7px; }
.preview-bar button { flex: 1; padding: 4px; font-size: 12px; }

/* 타임라인 */
.timeline {
  position: relative; height: 40px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; touch-action: none; user-select: none;
}
.timeline .track { position: absolute; inset: 12px 0; }
.timeline .kept { position: absolute; top: 0; bottom: 0; background: rgba(240,140,60,.22); border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); }
.trim-handle { position: absolute; top: 0; bottom: 0; width: 11px; margin-left: -5px; cursor: ew-resize; }
.trim-handle::after { content: ""; position: absolute; left: 4px; top: -6px; bottom: -6px; width: 3px; background: var(--accent); border-radius: 2px; }
.timeline .ticks { position: absolute; left: 0; right: 0; bottom: 1px; height: 10px; color: var(--dim); font-size: 10px; }
.timeline .ticks span { position: absolute; transform: translateX(-50%); }

/* 곡선 — 여기만 피그마 정본(BVH Studio / Tracking Editor) 디자인 언어를 따른다.
   배경 #08090B · 정상 #48A9C5 · 선택 #F5B642 · Noto Sans KR · Ease Out 160–240ms.
   나머지 화면은 아직 자리표시자다. */
/* 접이식 곡선 패널. 접히면 .curves 가 사라지고 헤더 한 줄만 남는다. */
.curve-panel { display: flex; flex-direction: column; gap: 8px; }
.curve-toggle {
  display: flex; align-items: center; gap: 7px;
  align-self: flex-start;
  background: transparent; border: none; padding: 2px 0;
  color: var(--dim); font: inherit; font-size: 12px; cursor: pointer;
}
.curve-toggle:hover { color: var(--text); }
.curve-toggle .tw {
  display: inline-block; font-size: 10px;
  transition: transform 160ms cubic-bezier(0, 0, 0.2, 1);
}
.curve-panel[data-open="0"] .tw { transform: rotate(-90deg); }
.curve-panel[data-open="0"] .curves { display: none; }
/* 접어도 임포트에 걸린 값은 보여야 한다 — 안 보이는 설정이 결과를 바꾸면
   원인을 찾을 방법이 없다. 기본값이 아닐 때만 켜진다. */
.curve-summary { color: #F5B642; }

.curves { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); }
.curve {
  background: #08090B;
  border: 1px solid #1D232B;
  border-radius: 6px;
  padding: 10px 12px;
  font-family: "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
  transition: border-color 200ms cubic-bezier(0, 0, 0.2, 1);
}
.curve:hover { border-color: #2D3946; }
.curve .ovl { color: #48A9C5; font-size: 10px; letter-spacing: .14em; margin-bottom: 3px; }
.curve h2 {
  margin: 0 0 6px; font-size: 12px; color: #E6EBF0; font-weight: 600;
  letter-spacing: -0.01em; line-height: 1.4; display: flex; justify-content: space-between;
}
.curve h2 .hint { font-weight: 400; color: #5B6672; letter-spacing: 0; }
.curve canvas { width: 100%; height: 118px; display: block; touch-action: none; cursor: crosshair; }

.status { color: var(--dim); font-size: 12px; min-height: 18px; padding: 0 2px; }
.status.is-error { color: #e2765e; }
.status.is-ok { color: #7fc98a; }

/* 삭제 확인 — 네이티브 confirm 대신 페이지 안 모달 (스타일 통제 + 채널 안 막음) */
.confirm-overlay {
  position: fixed; inset: 0; display: none;
  align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .6); z-index: 30;
}
.confirm-overlay.is-open { display: flex; }
.confirm-box {
  width: min(420px, 90vw);
  background: #08090B; border: 1px solid #1D232B; border-radius: 6px;
  padding: 16px 18px;
  font-family: "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
}
.confirm-box .confirm-text { margin: 0 0 6px; color: #E6EBF0; font-weight: 600; letter-spacing: -0.01em; }
.confirm-box .confirm-note { margin: 0 0 14px; color: var(--dim); font-size: 12px; line-height: 1.45; white-space: pre-line; }
.confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }
.confirm-actions .danger { background: #F5B642; border-color: #F5B642; color: #1a1a1a; font-weight: 600; }

.mock-note {
  position: fixed; right: 10px; bottom: 8px; font-size: 11px; color: var(--dim);
  background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 4px; pointer-events: none;
}
</style>
</head>
<body>

<div class="topbar">
  <!-- 폴더는 타이핑 말고 고르게 한다. 로컬 클립 폴더와 동기화본 폴더를 오가며
       견주는 일이 잦은데, 매번 경로를 치면 오타 하나로 "폴더에 .bvh 가 없습니다"
       를 보게 된다. -->
  <div class="folder-field">
    <input type="text" data-field="folder" value="C:\work\Ai\bvh-library" spellcheck="false">
    <button class="folder-drop" data-action="folder-history"
            aria-label="최근 연 폴더" aria-expanded="false" title="최근 연 폴더">▾</button>
    <div class="folder-list" data-field="folder-list" hidden></div>
  </div>
  <button data-action="refresh">새로고침</button>
  <button data-action="sync">Artoke에서 가져오기</button>
  <button class="video-add" data-action="add-video">영상 추가</button>
  <button data-action="blend-preview" title="8방향 세트가 엔진에서 제대로 섞일지 뷰어에서 검수">블렌드 검수</button>
</div>

<!-- 필터는 동작 버튼과 줄을 나눈다. 한 줄에 섞여 있으면 "폴더를 바꾸는 것"과
     "보고 있는 범위를 좁히는 것"이 같은 무게로 보여서 매번 읽고 골라야 한다. -->
<div class="filterbar">
  <!-- 사이트(viewer)의 ShelfChips 와 같은 3 줄. 카테고리를 고르면 역할 줄이,
       역할을 고르면 세부 줄이 열린다. 줄을 항상 세 개 그려 두지 않는 것은
       고르지 않았을 때 보여 줄 내용이 없어서다. -->
  <div class="shelf-chips">
    <div class="cat-bar" data-field="category" role="group" aria-label="카테고리"></div>
    <div class="cat-bar is-sub" data-field="sub" role="group" aria-label="역할" hidden></div>
    <div class="cat-bar is-detail" data-field="detail" role="group" aria-label="세부" hidden></div>
  </div>
  <input type="text" data-field="search" placeholder="검색 / 태그">
</div>

<div class="video-job-card" aria-live="polite">
  <div class="video-job-copy">
    <div class="video-job-label">영상 변환 대기</div>
    <div class="video-progress" aria-hidden="true"><span></span></div>
  </div>
  <span class="video-job-state"></span>
  <button data-action="cancel-video">취소</button>
</div>

<div class="body">
  <div class="clip-grid"></div>

  <div class="side">
    <div class="card preview">
      <h2>프리뷰</h2>
      <canvas></canvas>
      <div class="preview-bar">
        <button data-action="azimuth" data-deg="0">정면</button>
        <button data-action="azimuth" data-deg="45">45°</button>
        <button data-action="azimuth" data-deg="90">측면</button>
      </div>
    </div>

    <div class="card">
      <h2>임포트</h2>
      <div class="row"><label>대상</label><select data-field="target"><option value="">새 바이패드 생성</option></select></div>
      <div class="row"><label>이름</label><input type="text" data-field="name" value=""></div>
      <div class="row"><label>배치 간격</label><input type="number" data-field="spacing" value="120" min="0" max="2000" step="10"></div>
      <div class="row">
        <label class="check"><input type="checkbox" data-field="convert" checked> kimodo 변환</label>
        <label class="check"><input type="checkbox" data-field="mirror"> 미러</label>
      </div>
      <button class="primary" data-action="import" style="width:100%">바이패드 생성 + 임포트</button>

      <!-- 8방향 블렌드. 위 설정(대상·이름·배치 간격·convert·미러)을 그대로 쓰고
           클립 대신 굳힌 결과를 넣으므로 임포트 카드 안에 둔다. -->
      <div class="blend-block" data-blend hidden>
        <div class="blend-head">임의 방향으로 불러오기</div>
        <div class="row">
          <label>방향</label>

<script>
/* ==================================================================
   BVH Studio 구조 목업

   실제 툴에서는 아래 dummy* 함수 자리에 QWebChannel 의 `bridge` 가 들어간다.
   bridge 가 있으면 그걸 쓰고, 없으면 더미로 도는 구조 — 계획서 Task 10 Step 4
   의 "브라우저에서 먼저 확인한다" 를 그대로 따른 것이다.

   포즈 데이터 모양은 파이썬 build_pose_data() 의 반환값과 같다:
     { bones: [[parent, child], ...],
       poses: [ {joint: [x,y,z], ...}, ... ],
       frames: int, frame_time: float }
   ================================================================== */

/* Max 안에서는 QWebChannel 로 파이썬 브리지가 붙는다. 밖(브라우저)에서는
   더미 데이터로 돈다 — 디자인 반복을 Max 재시작 없이 돌리기 위한 것이다. */
const BRIDGE = { obj: null };

function bcall(method, arg, cb) {
  /* 브리지 슬롯은 항상 {ok, data|error} JSON 문자열을 돌려준다 */
  const done = (raw) => {
    let res;
    try { res = JSON.parse(raw); } catch (e) { res = { ok: false, error: "응답 파싱 실패: " + raw }; }
    cb(res);
  };
  if (arg === null) BRIDGE.obj[method](done);
  else BRIDGE.obj[method](arg, done);
}

function connectBridge() {
  if (typeof QWebChannel === "undefined" || !(window.qt && qt.webChannelTransport)) return false;
  new QWebChannel(qt.webChannelTransport, (channel) => {
    BRIDGE.obj = channel.objects.bridge;
    if (!BRIDGE.obj) { setStatus("bridge 객체가 등록되지 않았습니다", "error"); return; }
    loadClipsFromBridge();
  });
  return true;
}

/* ---------- 더미 클립 목록 ----------
   category/sub/detail 은 실제 데이터에서 artoke-manifest.json (사이트) 과
   local-shelf.json (로컬 전용) 이 준다. 더미에도 채워 그룹핑 디자인을 브라우저에서
   확인할 수 있게 한다. 세부까지 간 것, 역할까지만 간 것, 미분류를 섞어 뒀다 —
   셋 다 실제로 나오는 모양이라 하나라도 빠지면 그리드를 판단할 수 없다. */
const DUMMY_CLIPS = [
  { stem: "artoke_walk-forward",   tags: ["artoke", "walk-forward"], kind: "walk",   rendered: true, category: "locomotion", sub: "walk" },
  { stem: "artoke_run-fast",       tags: ["artoke", "run-fast"],     kind: "run",    rendered: true, category: "locomotion", sub: "run" },
  { stem: "artoke_idle-breath",    tags: ["artoke", "idle-breath"],  kind: "idle",   category: "idle", sub: "base" },
  { stem: "attack-normal-01",      tags: ["attack-normal-01"],       kind: "kick",   local: true, category: "attack", sub: "combo", detail: "hit1" },
  { stem: "attack-normal-02",      tags: ["attack-normal-02"],       kind: "kick",   local: true, category: "attack", sub: "combo", detail: "hit2" },
  { stem: "spin-kick",             tags: ["spin-kick"],              kind: "kick",   local: true, category: "attack", sub: "combo" },
  { stem: "attack-dash-start",     tags: ["attack-dash-start"],      kind: "run",    local: true, category: "attack", sub: "dash", detail: "start" },
  { stem: "jump-land",             tags: ["jump-land"],              kind: "jump",   local: true, category: "locomotion", sub: "jump", detail: "land" },
  { stem: "wave-hello",            tags: ["wave-hello"],             kind: "wave",   local: true, category: "emote", sub: "greet" },
  { stem: "broken-export_03",      tags: ["broken-export"],          kind: null,     local: true },
  { stem: "turn-left-90",          tags: ["turn-left-90"],           kind: "walk",   local: true },
  { stem: "sit-down",              tags: ["sit-down"],               kind: "sit",    local: true },
  { stem: "artoke_sprint-stop",    tags: ["artoke", "sprint-stop"],  kind: "run",    category: "locomotion", sub: "sprint" },
];

/* 사이트 분류표(viewer-models.ts)의 일부. 전부 옮기지 않는 것은 의도다 — 더미는
   그룹핑을 눈으로 보려고 있는 것이고, 정본은 언제나 매니페스트다. */
const DUMMY_CATEGORIES = [
  { slug: "idle", label: "대기", subs: [
    { slug: "base", label: "기본 자세" }, { slug: "reaction", label: "반응" },
  ]},
  { slug: "locomotion", label: "이동", subs: [
    { slug: "walk", label: "걷기" }, { slug: "jog", label: "조깅" },
    { slug: "run", label: "달리기" }, { slug: "sprint", label: "전력질주" },
    { slug: "turn", label: "방향 전환" },
    { slug: "jump", label: "점프", details: [
      { slug: "takeoff", label: "도약" }, { slug: "air", label: "공중" },
      { slug: "land", label: "착지" },
    ]},
  ]},
  { slug: "attack", label: "공격", subs: [
    { slug: "combo", label: "기본 연계", details: [
      { slug: "hit1", label: "1타" }, { slug: "hit2", label: "2타" },
      { slug: "hit3", label: "3타" }, { slug: "finish", label: "마무리" },
    ]},
    { slug: "dash", label: "돌진", details: [
      { slug: "start", label: "시작" }, { slug: "loop", label: "지속" },
      { slug: "end", label: "종료" },
    ]},
  ]},
  { slug: "emote", label: "감정 표현", subs: [{ slug: "greet", label: "인사" }] },
];

/* ---------- 더미 골격 ---------- */
const BONES = [
  ["Hips","Chest"],["Chest","Neck"],["Neck","Head"],
  ["Chest","LeftUpArm"],["LeftUpArm","LeftLowArm"],["LeftLowArm","LeftHand"],
  ["Chest","RightUpArm"],["RightUpArm","RightLowArm"],["RightLowArm","RightHand"],
  ["Hips","LeftUpLeg"],["LeftUpLeg","LeftLowLeg"],["LeftLowLeg","LeftFoot"],
  ["Hips","RightUpLeg"],["RightUpLeg","RightLowLeg"],["RightLowLeg","RightFoot"],
];

/* 동작별 성격. 실제 툴은 BVH 좌표를 쓰므로 이 표는 목업 전용이다 —
   카드가 전부 똑같아 보이면 그리드 디자인을 판단할 수 없어서 넣었다. */
const KINDS = {
  idle:   { amp: 0.12, crouch:  0, lift: 0, armUp: 0.0, splay: 0.0 },
  walk:   { amp: 0.55, crouch:  0, lift: 0, armUp: 0.0, splay: 0.0 },
  run:    { amp: 1.00, crouch:  6, lift: 0, armUp: 0.0, splay: 0.0 },
  kick:   { amp: 1.20, crouch:  0, lift: 0, armUp: 0.0, splay: 0.9 },
  jump:   { amp: 0.80, crouch: -8, lift: 26, armUp: 0.8, splay: 0.3 },
  crouch: { amp: 0.40, crouch: 34, lift: 0, armUp: 0.0, splay: 0.2 },
  wave:   { amp: 0.20, crouch:  0, lift: 0, armUp: 1.0, splay: 0.0 },
  sit:    { amp: 0.10, crouch: 46, lift: 0, armUp: 0.0, splay: 0.5 },
};

function dummyPose(phase, kind) {
  const TAU = Math.PI * 2;
  const k = KINDS[kind] || KINDS.walk;
  const amp = k.amp;
  const s = Math.sin(phase * TAU), c = Math.cos(phase * TAU);
  const bob = Math.abs(Math.sin(phase * TAU)) * 3 * amp;
  const hipY = 92 - bob - k.crouch + k.lift * Math.max(0, s);

  const legSwing = s * 32 * amp * (1 + k.splay), legSwing2 = -s * 32 * amp;
  const armSwing = -s * 26 * amp, armSwing2 = s * 26 * amp;
  const knee = Math.max(0, c) * 18 * amp + k.crouch * 0.6;

  const p = {};
  p.Hips  = [0, hipY, 0];
  p.Chest = [0, hipY + 26, 0];
  p.Neck  = [0, hipY + 44, 0];
  p.Head  = [0, hipY + 56, 0];

  const wave = k.armUp * (30 + 14 * s);
  p.LeftUpArm   = [-15, hipY + 41, 0];
  p.LeftLowArm  = [-19 - k.armUp * 4, hipY + 20 + wave, armSwing * 0.5];
  p.LeftHand    = [-21 - k.armUp * 8, hipY + 2 + wave * 2, armSwing];
  p.RightUpArm  = [ 15, hipY + 41, 0];
  p.RightLowArm = [ 19, hipY + 20, armSwing2 * 0.5];
  p.RightHand   = [ 21, hipY + 2,  armSwing2];

  p.LeftUpLeg   = [-8, hipY, 0];
  p.LeftLowLeg  = [-9, hipY - 42 + knee * 0.3, legSwing * 0.6];
  p.LeftFoot    = [-9, hipY - 84 + knee,       legSwing];
  p.RightUpLeg  = [ 8, hipY, 0];
  p.RightLowLeg = [ 9, hipY - 42, legSwing2 * 0.6];
  p.RightFoot   = [ 9, hipY - 84, legSwing2];
  return p;
}

/* 재생 프레임은 균등 간격이어야 원본 타이밍이 보존된다. 포즈 차이가 큰 순으로
   고르면 정지 한 장으로는 좋지만 이어 붙이면 멈췄다 순간이동하는 것처럼 보인다. */
const PLAYBACK_FRAMES = 24;

/* 정지 상태에서 보여줄 대표 프레임: 평균 포즈에서 가장 먼 것.
   0번은 대개 준비 자세라 무슨 동작인지 설명하지 못한다. (파이썬 poster_index 와 같은 규칙) */
function posterIndex(poses) {
  const vecs = poses.map((p) => {
    const root = p.Hips;
    return Object.keys(p).sort().flatMap((n) => [0, 1, 2].map((a) => p[n][a] - root[a]));
  });
  if (!vecs.length) return 0;
  const mean = vecs[0].map((_, i) => vecs.reduce((s, v) => s + v[i], 0) / vecs.length);
  const dist = (v) => v.reduce((s, x, i) => s + (x - mean[i]) ** 2, 0);
  let best = 0;
  vecs.forEach((v, i) => { if (dist(v) > dist(vecs[best])) best = i; });
  return best;
}

function dummyPoseData(kind) {
  if (!kind) return null;                       // 파싱 실패 클립
  const poses = [];
  for (let i = 0; i < PLAYBACK_FRAMES; i++) poses.push(dummyPose(i / PLAYBACK_FRAMES, kind));
  return { bones: BONES, poses, poster: posterIndex(poses), frames: 60, frame_time: 1 / 30 };
}

/* ---------- 그리기 ---------- */
function project(pos, azimuthDeg) {
  const r = azimuthDeg * Math.PI / 180;
  return [pos[0] * Math.cos(r) + pos[2] * Math.sin(r), pos[1]];
}

function fitCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: rect.width, h: rect.height };
}

/* 클립 전체 프레임을 덮는 투영 바운딩박스. 방위각마다 한 번만 계산해 캐시한다. */
function clipBounds(data, azimuth) {
  data._bounds = data._bounds || {};
  if (data._bounds[azimuth]) return data._bounds[azimuth];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const pose of data.poses) {
    for (const name in pose) {
      const [x, y] = project(pose[name], azimuth);
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  return (data._bounds[azimuth] = { minX, maxX, minY, maxY });
}

function drawPose(canvas, data, index, azimuth) {
  const { ctx, w, h } = fitCanvas(canvas);
  ctx.clearRect(0, 0, w, h);
  if (!data) {
    ctx.fillStyle = "#5a5a62";
    ctx.font = "12px system-ui";
    ctx.textAlign = "center";
    /* undefined = 브리지 응답 대기(로딩), null = 파싱 실패 */
    ctx.fillText(data === undefined ? "…" : "파싱 실패", w / 2, h / 2);
    return;
  }
  const pose = data.poses[((index % data.poses.length) + data.poses.length) % data.poses.length];
  const pts = {};
  for (const name in pose) pts[name] = project(pose[name], azimuth);

  /* 배율은 클립 전체 bounds 로 한 번만 정한다. 프레임마다 다시 맞추면
     (a) 웅크린 자세가 확대되어 선 자세와 구분이 안 되고
     (b) 재생 중 매 프레임 크기가 출렁여 캐릭터가 숨쉬듯 떨린다.
     파이썬 build_pose_data 가 클립 단위 bounds 를 캐시에 넣는 이유다. */
  const b = clipBounds(data, azimuth);
  const span = Math.max(b.maxX - b.minX, b.maxY - b.minY) || 1;
  const scale = (Math.min(w, h) * 0.82) / span;
  const cx = (b.maxX + b.minX) / 2, cy = (b.maxY + b.minY) / 2;
  const S = (p) => [w / 2 + (p[0] - cx) * scale, h / 2 - (p[1] - cy) * scale];

  ctx.lineCap = "round";
  ctx.lineWidth = Math.max(2, Math.min(w, h) / 40);
  ctx.strokeStyle = "#e0e0e4";
  ctx.beginPath();
  for (const [a, b] of data.bones) {
    if (!pts[a] || !pts[b]) continue;
    const p1 = S(pts[a]), p2 = S(pts[b]);
    ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
  }
  ctx.stroke();

  ctx.fillStyle = "#f08c3c";
  const r = Math.max(1.5, Math.min(w, h) / 60);
  for (const n in pts) {
    const p = S(pts[n]);
    ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- 상태 ---------- */
const state = {
  clips: [],
  categories: [],         // 사이트의 선반 구조 (artoke-manifest.json 에서)
  // 고른 선반 ("" = 그 단계는 안 좁힘). DOM 이 아니라 여기가 정본이다.
  category: "",
  sub: "",
  detail: "",
  poseCache: new Map(),
  pending: new Set(),      // 브리지에 포즈를 요청해 놓고 기다리는 클립
  importCount: 0,          // 배치 간격 = importCount x spacing (원본 .ms 와 같은 규칙)
  selected: null,
  hovered: null,
  azimuth: 0,
  trim: [0, 1],
  // 기본은 펼침. 처음부터 접혀 있으면 곡선이 있다는 걸 모르는 사람이 생기는데,
  // 임포트 결과를 바꾸는 기능이라 발견성을 깎을 만한 이득이 아니다.
  curvesOpen: (() => {
    try { return localStorage.getItem("bvhStudio.curvesOpen") !== "0"; }
    catch (e) { return true; }
  })(),
  speedPoints:  [[0, 0], [1, 1]],
  // 0 에서 시작한다. 곡선을 임포트에 실제로 걸게 되었으므로, 기본값이 0 이
  // 아니면 아무도 요청하지 않은 팔 벌림이 모든 임포트에 붙는다.
  armPoints:    [[0, 0], [1, 0]],
  videoJob: null,
  videoTimer: null,
  // 8방향 블렌드. tiers 가 비어 있으면 컨트롤을 잠근다 — 세트가 없거나 위상 파일이
  // 없는 상태에서 섞으면 발이 엇갈린 클립이 나오므로 이유를 말하고 막는다.
  folder: "",
  blendTiers: [],
  blendHasPhase: false,
  blendAngle: 0,
  blendSpeed: 0,
};

const grid = document.querySelector(".clip-grid");
const previewCanvas = document.querySelector(".preview canvas");
const statusEl = document.querySelector(".status");

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (kind ? " is-" + kind : "");
}

function poseFor(stem) {
  if (state.poseCache.has(stem)) return state.poseCache.get(stem);
  const clip = state.clips.find((c) => c.stem === stem);

  /* 브리지가 있고 실제 파일 경로가 있으면 파이썬에서 FK 좌표를 받아온다.
     비동기라 도착 전에는 undefined(로딩)를 돌려주고, 도착하면 그 카드만 다시 그린다. */
  if (BRIDGE.obj && clip && clip.path) {
    if (!state.pending.has(stem)) {
      state.pending.add(stem);
      bcall("pose_data", clip.path, (res) => {
        state.pending.delete(stem);
        state.poseCache.set(stem, res.ok ? res.data : null);
        const card = grid.querySelector('.clip-card[data-stem="' + CSS.escape(stem) + '"]');
        if (card) {
          if (!res.ok) { card.classList.add("is-broken"); card.title = res.error; }
          drawPose(card.querySelector("canvas"), state.poseCache.get(stem), posterOf(stem), 0);
          card.querySelector(".tags").textContent = clipMeta(stem);
        }
      });
    }
    return undefined;                          // 로딩 중
  }

  state.poseCache.set(stem, dummyPoseData(clip ? clip.kind : null));
  return state.poseCache.get(stem);
}

/* 블렌드 컨트롤은 세트가 갖춰졌을 때만 열린다. 조용히 감추지 않고 왜 못 쓰는지
   적는다 — 감추면 "이 기능이 있는데 안 보인다"가 되고, 이유를 적으면 동기화하면
   된다는 것이 바로 읽힌다. */
function setBlendBusy(busy) {
  const button = document.querySelector('[data-action="blend-import"]');
  if (!button) return;
  button.disabled = busy;
  button.textContent = busy ? "굳히는 중…" : "이 방향으로 불러오기";
}

function renderBlendControls() {
  const block = document.querySelector("[data-blend]");
  const note = document.querySelector("[data-blend-note]");
  if (!block || !note) return;
  const usable = state.blendTiers.length > 0 && state.blendHasPhase;
  block.hidden = !usable;

  if (usable) {
    /* 층이 하나뿐이면 섞을 속도가 없다 — 방향만 열어 둔다. */
    const single = state.blendTiers.length < 2;
    const speed = document.querySelector('[data-field="blend-speed"]');
    speed.disabled = single;
    document.querySelector('[data-out="blend-speed"]').textContent = single
      ? state.blendTiers[0]
      : blendSpeedLabel();
    note.hidden = false;
    note.textContent = "속도층: " + state.blendTiers.join(" → ");
    return;
  }

  note.hidden = false;
  if (state.blendTiers.length === 0) {
    note.textContent =
      "8방향 세트가 없어 임의 방향 불러오기를 쓸 수 없습니다 — Artoke에서 가져오면 열립니다.";
  } else {
    note.textContent =
      "phase.json 이 없어 발접지를 맞출 수 없습니다 — 다시 동기화하세요. " +
      "정렬 없이 섞으면 발이 엇갈린 클립이 나옵니다.";
  }
}

function blendSpeedLabel() {
  /* 슬라이더 위치가 어느 층 사이에 있는지 이름으로 보여준다. m/s 는 굳혀 봐야
     알 수 있으므로(위상 가중 평균이 필요하다) 여기서는 층 이름만 쓴다. */
  const tiers = state.blendTiers;
  if (tiers.length < 2) return tiers[0] || "—";
  const span = state.blendSpeed * (tiers.length - 1);
  const low = Math.min(tiers.length - 2, Math.floor(span));
  const t = span - low;
  if (t < 0.02) return tiers[low];
  if (t > 0.98) return tiers[low + 1];
  return tiers[low] + " → " + tiers[low + 1];
}

function refreshBlendTiers() {
  if (!BRIDGE.obj) { renderBlendControls(); return; }
  bcall("blend_tiers", state.folder, (res) => {
    state.blendTiers = res.ok ? res.data.tiers || [] : [];
    state.blendHasPhase = res.ok ? !!res.data.hasPhase : false;
    renderBlendControls();
  });
}

const FOLDER_HISTORY_KEY = "bvhStudio.folders";
const FOLDER_HISTORY_MAX = 8;

/* 최근 연 폴더. 클립이 실제로 있던 폴더만 기억한다 — 오타로 아무것도 못 읽은
   경로까지 남기면 목록이 금세 쓰레기가 되고, 그러면 고르는 값이 없어진다.
   윈도 경로는 대소문자를 구분하지 않으므로 중복 판정도 그렇게 한다. */
function folderHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(FOLDER_HISTORY_KEY) || "[]");
    return Array.isArray(saved) ? saved.filter((v) => typeof v === "string" && v) : [];
  } catch (e) {
    return [];
  }
}

function saveFolderHistory(list) {
  try { localStorage.setItem(FOLDER_HISTORY_KEY, JSON.stringify(list)); } catch (e) {}
  return list;
}

function rememberFolder(folder) {
  if (!folder) return;
  const key = folder.toLowerCase();
  return saveFolderHistory(
    [folder, ...folderHistory().filter((v) => v.toLowerCase() !== key)]
      .slice(0, FOLDER_HISTORY_MAX)
  );
}

/* 목록에서만 뺀다. 폴더도 그 안의 클립도 건드리지 않는다 — 이름이 "삭제" 라
   폴더가 지워지는 것으로 읽힐 수 있어, 확인 문구에서 그 점을 분명히 한다. */
function forgetFolder(folder) {
  const key = folder.toLowerCase();
  return saveFolderHistory(folderHistory().filter((v) => v.toLowerCase() !== key));
}

function renderFolderHistory() {
  const list = document.querySelector('[data-field="folder-list"]');
  const current = (document.querySelector('[data-field="folder"]').value || "").toLowerCase();
  // 지금 열려 있는 폴더는 뺀다 — 고르면 아무 일도 안 일어나는 항목이다.
  const entries = folderHistory().filter((v) => v.toLowerCase() !== current);
  list.innerHTML = "";
  if (!entries.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "최근 연 폴더가 없습니다";
    list.appendChild(empty);
    return;
  }
  for (const folder of entries) {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.folder = folder;
    button.textContent = folder;
    button.title = folder;
    list.appendChild(button);
  }
}

function setFolderListOpen(open) {
  const list = document.querySelector('[data-field="folder-list"]');
  if (open) renderFolderHistory();
  list.hidden = !open;
  document
    .querySelector('[data-action="folder-history"]')
    .setAttribute("aria-expanded", String(open));
}

function loadClipsFromBridge(selectPath) {
  const folder = document.querySelector('[data-field="folder"]').value;
  state.folder = folder;
  refreshBlendTiers();
  bcall("list_clips", folder, (res) => {
    /* 실패해도 이전 폴더 클립을 화면에 남기지 않는다.

       남겨 두면 경로를 바꾸고 새로고침해도 그리드가 그대로라, 폴더가 안 바뀐
       것처럼 보인다 (오타 난 경로에서 실제로 그랬다). 더 나쁜 것은 남은 카드의
       path 가 옛 폴더를 가리킨다는 점이다 — 그 상태로 임포트하면 지금 보고 있는
       폴더가 아닌 파일이 들어간다. */
    const clips = res.ok ? res.data.clips : [];
    state.clips = clips;
    state.categories = res.ok ? res.data.categories || [] : [];
    state.poseCache.clear();
    state.pending.clear();
    if (!clips.length) state.selected = null;
    if (selectPath) {
      const selected = clips.find((clip) => clip.path === selectPath);
      if (selected) state.selected = selected.stem;
    }
    renderShelfChips();
    renderGrid();

    if (clips.length) {
      rememberFolder(folder);
      setStatus("라이브러리 " + clips.length + "개 클립 (실제 데이터)", "ok");
      refreshBipeds();
    } else if (!res.ok) {
      setStatus(res.error, "error");
    } else if (res.data.exists === false) {
      // 경로를 고쳐야 하는 경우와 파일을 넣어야 하는 경우는 할 일이 다르다.
      setStatus("그런 폴더가 없습니다: " + folder, "error");
    } else {
      setStatus("폴더에 .bvh 가 없습니다: " + folder, "error");
    }
  });
}

const VIDEO_STAGES = {
  queued: "대기", extracting: "관절 추정", converting: "BVH 변환",
  validating: "검증", complete: "완료", blocked: "설치 필요",
  failed: "실패", cancelled: "취소됨"
};

function showVideoJob(job) {
  state.videoJob = job;
  const card = document.querySelector(".video-job-card");
  card.classList.add("is-visible");
  card.querySelector(".video-job-label").textContent = job.video || "영상 변환";
  card.querySelector(".video-job-state").textContent = VIDEO_STAGES[job.stage] || job.stage;
  card.querySelector(".video-progress > span").style.width = (job.progress || 0) + "%";
  card.querySelector('[data-action="cancel-video"]').style.display =
    ["complete", "blocked", "failed", "cancelled"].includes(job.status) ? "none" : "block";
}

function pollVideoJob(jobId) {
  clearTimeout(state.videoTimer);
  bcall("video_job_status", jobId, (res) => {
    if (!res.ok) { setStatus(res.error, "error"); return; }
    const job = res.data;
    showVideoJob(job);
    if (!["complete", "blocked", "failed", "cancelled"].includes(job.status)) {
      state.videoTimer = setTimeout(() => pollVideoJob(jobId), 500);
    } else if (job.status === "complete") {
      setStatus("BVH 생성 완료: " + job.bvh_path, "ok");
      loadClipsFromBridge(job.bvh_path);
    } else if (job.status === "blocked") {
      setStatus("RTMW3D 설치가 필요합니다: " + job.help_path, "error");
    } else if (job.status === "failed") {
      setStatus(job.error || "영상 변환 실패", "error");
    } else {
      setStatus("영상 변환을 취소했습니다.");
    }
  });
}

function addVideo() {
  if (!BRIDGE.obj) { setStatus("영상 추가는 3ds Max 안에서 동작합니다.", "error"); return; }
  bcall("choose_video", null, (picked) => {
    if (!picked.ok) { setStatus(picked.error, "error"); return; }
    if (picked.data.cancelled) return;
    const payload = {
      video: picked.data.path,
      library: document.querySelector('[data-field="folder"]').value
    };
    setStatus("RTMW3D 관절 추정 준비 중…");
    bcall("start_video_job", JSON.stringify(payload), (started) => {
      if (!started.ok) { setStatus(started.error, "error"); return; }
      showVideoJob(started.data);
      pollVideoJob(started.data.id);
    });
  });
}

/* 임포트 한 번. 클립 그리드에서 고른 파일과 굳힌 블렌드가 같은 경로를 쓴다 —
   대상 셀렉트, 이름, 배치 간격, convert, 미러가 한 군데에만 있어야 둘이 갈리지 않는다.
   extras 는 호출자가 넣는 페이로드 추가분(트림·타임맵·팔 키)이고, label 은 상태줄에
   쓸 사람이 읽는 이름이다. */
function importPath(path, stem, extras, label) {
  const target = document.querySelector('[data-field="target"]').value;
  const shown = label || stem;
  const payload = Object.assign(
    {
      path: path,
      convert: document.querySelector('[data-field="convert"]').checked,
      mirror: document.querySelector('[data-field="mirror"]').checked,
    },
    extras || {},
  );
  if (target) {
    /* 기존 바이패드에 적용 — 이름/배치 간격은 새 바이패드 전용이라 안 보낸다 */
    payload.biped = target;
    setStatus("적용 중… (" + shown + " → " + target + ")");
    bcall("retarget_clip", JSON.stringify(payload), (res) => {
      if (res.ok) {
        setStatus(res.data.message, "ok");
        refreshBipeds();
      } else setStatus(res.error, "error");
    });
    return;
  }
  payload.name = document.querySelector('[data-field="name"]').value || ("Bip_" + stem);
  payload.x_offset = state.importCount * Number(document.querySelector('[data-field="spacing"]').value || 0);
  setStatus("임포트 중… (" + shown + ")");
  bcall("import_clip", JSON.stringify(payload), (res) => {
    if (res.ok) {
      state.importCount++;
      setStatus(res.data.message, "ok");
      refreshBipeds();
    } else setStatus(res.error, "error");
  });
}

function refreshBipeds() {
  if (!BRIDGE.obj) return;
  bcall("scene_bipeds", null, (res) => {
    if (!res.ok) return;
    /* "임포트 후" 의 biped 셀렉트와 "임포트" 의 대상 셀렉트를 같은 목록으로 채운다.
       대상 셀렉트는 맨 앞에 "새 바이패드 생성"(빈 값) 을 유지하고 선택을 보존한다. */
    for (const field of ["biped", "target"]) {
      const sel = document.querySelector('[data-field="' + field + '"]');
      const prev = sel.value;
      sel.innerHTML = "";
      if (field === "target") {
        const none = document.createElement("option");
        none.value = "";
        none.textContent = "새 바이패드 생성";
        sel.appendChild(none);
      }
      for (const name of res.data) {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        sel.appendChild(opt);
      }
      if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
    }
    updateImportButton();
  });
}

/* 대상이 기존 바이패드면 버튼이 하는 일이 달라진다 — 라벨로 알려준다 */
function updateImportButton() {
  const target = document.querySelector('[data-field="target"]').value;
  document.querySelector('[data-action="import"]').textContent =
    target ? "선택한 바이패드에 적용" : "바이패드 생성 + 임포트";
}

/* 속도 곡선이 항등이 아니면 (출력비율, 원본비율) 제어점을 프레임 단위 time_map 으로
   편다. 파이썬 build_time_map 과 같은 선형 보간 — 인덱스는 트림된 뒤 기준이다. */
/* 속도 곡선이 손대지 않은 그대로인가. 그대로면 임포트에 time_map 을 안 보낸다. */
function speedCurveIsIdentity() {
  const pts = state.speedPoints;
  return (
    pts.length === 2 &&
    pts[0][0] === 0 && pts[0][1] === 0 &&
    pts[1][0] === 1 && pts[1][1] === 1
  );
}

function timeMapFromCurve(data) {
  const pts = state.speedPoints;
  if (speedCurveIsIdentity() || !data || !data.frames) return null;
  const nSrc = Math.max(1, Math.round(data.frames * (state.trim[1] - state.trim[0])));
  const last = nSrc - 1;
  const outFrames = Math.max(1, Math.round(pts[pts.length - 1][0] * last) + 1);
  /* 화면과 같은 PCHIP 스플라인으로 샘플한다. 이론상 단조가 보장되지만
     부동소수 오차 방지로 누적 최댓값 클램프를 한 번 더 건다 (warp 의 감소 금지). */
  const map = [];
  let prev = 0;
  for (let i = 0; i < outFrames; i++) {
    let v = sampleCurve(pts, last ? i / last : 0) * last;
    if (v < prev) v = prev;
    map.push(v);
    prev = v;
  }
  return map;
}

/* 팔 간격 곡선의 최대 각도. 곡선 y(0~1) 를 여기에 곱해 도(度)로 만든다. */
const ARM_MAX_DEG = 45;

/* 팔 간격 곡선을 (프레임, 각도) 키로 편다.
   x 축은 임포트된 클립의 프레임 범위에 맞춘다 — 트림하면 짧아지고 속도 곡선을
   걸면 time_map 길이가 된다. 원본 프레임 수로 찍으면 키가 클립 밖으로 나간다. */
function armKeysFromCurve(data, timeMap) {
  const pts = state.armPoints;
  if (!pts.some((p) => p[1] > 0)) return null;      // 0 에 눕혀 두면 안 건다
  const frames = timeMap
    ? timeMap.length
    : data && data.frames
      ? Math.max(1, Math.round(data.frames * (state.trim[1] - state.trim[0])))
      : 0;
  if (!frames) return null;
  const last = Math.max(0, frames - 1);
  return pts.map((p) => [Math.round(p[0] * last), p[1] * ARM_MAX_DEG]);
}

/* 호버가 끝나면 0번이 아니라 대표 프레임으로 되돌아간다 */
function posterOf(stem) {
  const data = poseFor(stem);
  return data ? (data.poster || 0) : 0;
}

/* ---------- 그리드 ---------- */
function makeCard(clip) {
  const card = document.createElement("div");
  card.className = "clip-card";
  card.dataset.stem = clip.stem;
  /* 브리지 클립(path 있음)은 포즈 요청이 실패했을 때만 is-broken 이 붙는다
     (poseFor 콜백). 더미 클립은 kind 가 없으면 파싱 실패 시나리오다. */
  if (!clip.path && !clip.kind) {
    card.classList.add("is-broken");
    card.title = "BVH 파싱 실패 — 목록에서 빼지 않고 사유를 표시한다";
  }
  if (state.poseCache.get(clip.stem) === null && clip.path) {
    card.classList.add("is-broken");
  }
  if (clip.stem === state.selected) card.classList.add("is-selected");
  // Max 배치가 찍은 PNG 가 있으면 그걸 쓰고, 없으면 canvas 로 계산해 그린다.
  // PNG 가 없다고 빈칸을 만들지 않는다 — 라이브러리는 Max 없이도 즉시 열려야 한다.
  if (clip.rendered) card.classList.add("is-rendered");
  // 사이트에서 내려온 클립은 접두사가 붙어 저장된다. 접두사가 없으면 이 PC 에만
  // 있는 것이고, 동기화가 다시 받아 주지 않으므로 파랗게 표시한다.
  if (clip.local) card.classList.add("is-local");
  card.innerHTML =
    "<canvas></canvas><span class='thumb-badge'>MAX</span>" +
    "<span class='local-badge' title='이 PC 에만 있는 클립 — 동기화로 복구되지 않습니다'>LOCAL</span>" +
    "<div class='name'></div><div class='tags'></div>";
  card.querySelector(".name").textContent = clip.stem;
  card.querySelector(".tags").textContent = clipMeta(clip.stem);
  return card;
}

/* 카드 둘째 줄. 태그(stem 을 "_" 로 쪼갠 것)는 첫 줄과 같은 말이라 자리만
   먹었다 — artoke_run-b 아래에 "artoke · run-b". 대신 길이를 보여준다:
   6초짜리와 2초짜리를 누르지 않고 구분할 수 있어야 고르는 값이 있다.
   포즈는 비동기라 도착 전에는 점을 찍어 두고, 도착하면 그 카드만 고친다. */
function clipMeta(stem) {
  const data = state.poseCache.get(stem);
  if (data === null) return "파싱 실패";
  if (!data) return "…";
  return data.frames + "프레임 · " + (data.frames * data.frame_time).toFixed(1) + "초";
}

/* 헤더 카테고리 필터의 "미분류" 값. 빈 문자열은 "전체"라 쓸 수 없다. */
const UNSHELVED = "__unshelved";

function currentQuery() {
  return (document.querySelector('[data-field="search"]').value || "").trim().toLowerCase();
}

/* 클립이 얹힌 선반의 한국어 이름들. 클립 이름은 전부 영어라 이게 없으면
   "돌진" 으로는 아무것도 못 찾는다 — 화면에는 온통 한국어 선반 이름인데. */
function shelfLabels(clip) {
  const category = state.categories.find((c) => c.slug === clip.category);
  if (!category) return [];
  const sub = (category.subs || []).find((s) => s.slug === clip.sub);
  const detail = sub && (sub.details || []).find((d) => d.slug === clip.detail);
  return [category.label, sub && sub.label, detail && detail.label].filter(Boolean);
}

/* 검색어에 맞는 클립. 선반 좁히기는 여기서 하지 않는다 — 칩이 "검색 결과가
   어느 선반에 있는지" 를 세려면 좁히기 전 집합이 필요하다. */
function queryMatches() {
  const q = currentQuery();
  if (!q) return state.clips;
  return state.clips.filter(
    (clip) =>
      clip.stem.toLowerCase().includes(q) ||
      clip.tags.some((tag) => String(tag).toLowerCase().includes(q)) ||
      shelfLabels(clip).some((label) => label.toLowerCase().includes(q))
  );
}

/* 칩이 고른 범위 안인가. */
function inShelf(clip) {
  return (
    (!state.category ||
      (state.category === UNSHELVED ? !clip.category : clip.category === state.category)) &&
    (!state.sub || clip.sub === state.sub) &&
    (!state.detail || clip.detail === state.detail)
  );
}

/* 검색어를 넣었는데 고른 선반에 결과가 하나도 없으면 선반 선택을 푼다.

   3 단 칩이 생기면서 검색이 "지금 서 있는 선반 안" 으로 좁혀졌다. 공격>돌진 을
   보다가 walk 를 치면 라이브러리에 걷기 클립이 있는데도 빈 화면만 나오고,
   무엇이 왜 걸러졌는지는 어디에도 안 적혀 있다. 칩이 눈에 띄게 풀리므로 무슨
   일이 일어났는지는 화면이 말해 준다. 결과가 있는 선반은 그대로 둔다 — 선반
   안에서 좁혀 찾는 것도 여전히 되어야 한다. */
function widenIfShelfHasNoMatch() {
  if (!currentQuery()) return;
  if (queryMatches().some(inShelf)) return;
  state.category = "";
  state.sub = "";
  state.detail = "";
}

function countClips(predicate) {
  return queryMatches().filter(predicate).length;
}

function addChip(bar, { value, label, count, on, empty }) {
  const button = document.createElement("button");
  button.className = "cat-chip" + (on ? " is-on" : "") + (empty ? " is-empty" : "");
  button.dataset.value = value;
  button.setAttribute("aria-pressed", String(on));
  button.textContent = label;
  if (count !== null) {
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = count;
    button.appendChild(n);
  }
  bar.appendChild(button);
}

/* 사이트(viewer)의 ShelfChips 와 같은 세 줄: 카테고리 -> 역할 -> 세부.
   위 단계를 고르기 전까지 아래 줄은 열리지 않는다.

   빈 선반도 점선으로 그린다. 예전에는 클립이 실제로 있는 선반만 그렸는데,
   사이트와 다르게 보이는 데다 "이 라이브러리에 뭐가 비어 있는가" 를 볼 수 없었다.
   비어 있는 칸이 다음에 만들 클립을 가리킨다는 것이 사이트 쪽 판단이고, 같은
   분류표를 쓰는 이상 여기서 다르게 굴 이유가 없다.

   선택은 보존한다 — 폴더를 새로고침할 때마다 전체로 돌아가면 좁혀 둔 의미가 없다. */
function renderShelfChips() {
  // 고르고 있던 칸이 분류표에서 사라졌으면(폴더를 바꿨거나 분류가 갱신됐거나)
  // 그 단계부터 풀어 준다. 안 그러면 존재하지 않는 칸을 고른 채 빈 화면만 본다.
  let picked = state.category === UNSHELVED ? null : findCategory(state.category);
  if (state.category && state.category !== UNSHELVED && !picked) state.category = "";
  let pickedSub = picked && (picked.subs || []).find((s) => s.slug === state.sub);
  if (state.sub && !pickedSub) { state.sub = ""; pickedSub = null; }
  const details = (pickedSub && pickedSub.details) || null;
  if (state.detail && !(details || []).some((d) => d.slug === state.detail)) state.detail = "";

  const catBar = document.querySelector('[data-field="category"]');
  catBar.innerHTML = "";
  // 숫자는 검색 결과 기준이다. 라이브러리 전체를 세면 "공격 48" 옆에서 그리드가
  // "일치하는 클립이 없습니다" 라고 말하는 모순이 생긴다 — 그 모순이 검색이
  // 고장 난 것처럼 보이게 만들었다.
  addChip(catBar, { value: "", label: "전체", count: queryMatches().length, on: !state.category });
  for (const cat of state.categories) {
    const n = countClips((c) => c.category === cat.slug);
    addChip(catBar, {
      value: cat.slug, label: cat.label, count: n,
      on: state.category === cat.slug, empty: n === 0,
    });
  }
  // 미분류는 분류표에 없는 칸이라 클립이 있을 때만 그린다 — 빈 "미분류" 는
  // 채울 대상이 아니라서 점선으로 남겨 둘 이유가 없다.
  const loose = countClips((c) => !c.category);
  if (loose) {
    addChip(catBar, {
      value: UNSHELVED, label: "미분류", count: loose, on: state.category === UNSHELVED,
    });
  }

  const subBar = document.querySelector('[data-field="sub"]');
  subBar.innerHTML = "";
  subBar.hidden = !picked;
  if (picked) {
    addChip(subBar, { value: "", label: "전체", count: null, on: !state.sub });
    for (const sub of picked.subs || []) {
      const n = countClips((c) => c.category === picked.slug && c.sub === sub.slug);
      addChip(subBar, {
        value: sub.slug, label: sub.label, count: n,
        on: state.sub === sub.slug, empty: n === 0,
      });
    }
  }

  const detailBar = document.querySelector('[data-field="detail"]');
  detailBar.innerHTML = "";
  detailBar.hidden = !details;
  if (details) {
    addChip(detailBar, { value: "", label: "전체", count: null, on: !state.detail });
    for (const det of details) {
      const n = countClips(
        (c) => c.category === picked.slug && c.sub === pickedSub.slug && c.detail === det.slug
      );
      addChip(detailBar, {
        value: det.slug, label: det.label, count: n,
        on: state.detail === det.slug, empty: n === 0,
      });
    }
  }
}

function findCategory(slug) {
  return slug ? state.categories.find((c) => c.slug === slug) : null;
}

/* 사이트(viewer)와 같은 선반: 카테고리→역할→세부 순서대로, 빈 그룹은 건너뛰고,
   매니페스트에 없는 클립(로컬 생성분)은 맨 아래 "미분류" 로 모은다.

   세부(detail)는 사이트에서도 선택이라 없는 클립이 흔하다. 그런 클립은 역할
   선반에 그대로 남는다 — 아무 세부 칸에나 끼워 넣으면 "돌진 시작" 선반에 시작이
   아닌 클립이 섞여서 분류가 거짓말이 된다. */
function shelveClips(shown) {
  const groups = [];
  const taken = new Set();
  const push = (en, ko, items) => {
    if (!items.length) return;
    groups.push({ en, ko, items });
    for (const c of items) taken.add(c.stem);
  };
  for (const cat of state.categories) {
    for (const sub of cat.subs || []) {
      const inSub = shown.filter((c) => c.category === cat.slug && c.sub === sub.slug);
      for (const det of sub.details || []) {
        push(
          cat.slug + " / " + sub.slug + " / " + det.slug,
          cat.label + " · " + sub.label + " · " + det.label,
          inSub.filter((c) => c.detail === det.slug)
        );
      }
      push(
        cat.slug + " / " + sub.slug,
        cat.label + " · " + sub.label,
        inSub.filter((c) => !taken.has(c.stem))
      );
    }
    push(cat.slug, cat.label, shown.filter((c) => c.category === cat.slug && !taken.has(c.stem)));
  }
  const rest = shown.filter((c) => !taken.has(c.stem));
  if (rest.length) groups.push({ en: "unshelved", ko: "미분류 · 로컬 생성", items: rest });
  return groups;
}

function renderGrid() {
  grid.innerHTML = "";
  const shown = queryMatches().filter(inShelf);
  if (!shown.length) {
    /* 빈 화면은 왜 비었는지 말해야 한다. 폴더에 클립이 없는 것, 검색어가 걸러낸
       것, 선반이 걸러낸 것은 할 일이 서로 다른데 예전에는 셋 다 같은 한 줄이었다.
       검색어는 사용자가 친 글자라 textContent 로 넣는다. */
    const note = document.createElement("div");
    note.style.cssText = "color:var(--dim);padding:16px";
    if (!state.clips.length) {
      note.textContent = "이 폴더에 클립이 없습니다.";
    } else if (currentQuery()) {
      note.textContent =
        '"' + currentQuery() + '" 와 맞는 클립이 없습니다 — 라이브러리에는 ' +
        state.clips.length + "개 있습니다.";
    } else {
      note.textContent =
        "고른 선반에 클립이 없습니다 — 라이브러리에는 " + state.clips.length + "개 있습니다.";
    }
    grid.appendChild(note);
    return;
  }
  for (const group of shelveClips(shown)) {
    const section = document.createElement("div");
    section.className = "clip-group";
    section.innerHTML = '<p class="clip-group-label"></p><div class="clip-cards"></div>';
    const label = section.querySelector(".clip-group-label");
    label.textContent = group.en;
    const ko = document.createElement("span");
    ko.className = "ko";
    ko.textContent = group.ko;
    label.appendChild(ko);
    const cards = section.querySelector(".clip-cards");
    for (const clip of group.items) cards.appendChild(makeCard(clip));
    // 캔버스는 문서에 붙은 뒤에 그린다 — 떨어진 채 그리면 rect 가 0×0 이라
    // 1픽셀을 카드 크기로 늘린 단색 사각형이 된다.
    grid.appendChild(section);
    for (const card of cards.children) {
      const stem = card.dataset.stem;
      drawPose(card.querySelector("canvas"), poseFor(stem), posterOf(stem), 0);
      // poseFor 뒤에 다시 쓴다 — makeCard 시점에는 아직 포즈를 요청하기 전이라
      // 캐시가 비어 있다. 브리지에서는 여기서도 아직 "…" 이고 콜백이 채운다.
      card.querySelector(".tags").textContent = clipMeta(stem);
    }
  }
}

/* 문서 전체에 rAF 루프는 하나뿐이다.
   호버 중인 카드 하나와 프리뷰만 프레임을 돌린다.
   카드마다 타이머를 두면 클립이 늘수록 죽는다. */
let lastTick = 0, frameIndex = 0;
function tick(now) {
  if (now - lastTick > 90) {
    lastTick = now;
    frameIndex++;
    if (state.hovered) {
      const card = grid.querySelector('.clip-card[data-stem="' + CSS.escape(state.hovered) + '"]');
      if (card) drawPose(card.querySelector("canvas"), poseFor(state.hovered), frameIndex, 0);
    }
    if (state.selected) drawPose(previewCanvas, poseFor(state.selected), frameIndex, state.azimuth);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

grid.addEventListener("mouseover", (e) => {
  const card = e.target.closest(".clip-card");
  if (!card || card.dataset.stem === state.hovered) return;
  if (state.hovered) {
    const prev = grid.querySelector('.clip-card[data-stem="' + CSS.escape(state.hovered) + '"]');
    if (prev) drawPose(prev.querySelector("canvas"), poseFor(state.hovered), posterOf(state.hovered), 0);
  }
  state.hovered = card.dataset.stem;
});
grid.addEventListener("mouseleave", () => {
  if (state.hovered) {
    const prev = grid.querySelector('.clip-card[data-stem="' + CSS.escape(state.hovered) + '"]');
    if (prev) drawPose(prev.querySelector("canvas"), poseFor(state.hovered), posterOf(state.hovered), 0);
  }
  state.hovered = null;
});
grid.addEventListener("click", (e) => {
  const card = e.target.closest(".clip-card");
  if (!card) return;
  if (card.classList.contains("is-broken")) { setStatus("파싱에 실패한 클립입니다.", "error"); return; }
  state.selected = card.dataset.stem;
  document.querySelector('[data-field="name"]').value = "Bip_" + state.selected;
  renderGrid();
  const data = poseFor(state.selected);
  if (data) setStatus(state.selected + " — " + data.frames + "프레임 / " + (data.frames * data.frame_time).toFixed(1) + "초");
  else setStatus(state.selected + " — 포즈 로딩 중…");
});

/* ---------- 삭제 (우클릭 → 확인 모달) ----------
   네이티브 confirm() 은 QWebEngine 채널을 막을 수 있어 페이지 안 모달로 받는다.
   삭제는 로컬 라이브러리 폴더만 정리한다 — 사이트(홈페이지)에는 아무 요청도
   보내지 않는다. */
const confirmOverlay = document.querySelector(".confirm-overlay");

/* 확인 상자는 이제 두 가지를 받는다 — 클립 삭제와 최근 폴더 목록 정리. 무엇을
   할지는 부르는 쪽이 함수로 넘긴다. 종류별로 pending 슬롯을 따로 두면 둘 다
   차 있는 상태가 생길 수 있어서, 대기 중인 동작은 언제나 하나다. */
function openConfirm(text, note, run, label) {
  state.pendingConfirm = { run: run };
  confirmOverlay.querySelector(".confirm-text").textContent = text;
  confirmOverlay.querySelector(".confirm-note").textContent = note;
  confirmOverlay.querySelector('[data-action="confirm-delete"]').textContent =
    label || "정말로 삭제하겠습니다";
  confirmOverlay.classList.add("is-open");
}

function closeConfirm() {
  state.pendingConfirm = null;
  confirmOverlay.classList.remove("is-open");
}

function openDeleteConfirm(clip) {
  let note = "라이브러리 폴더에서만 지워집니다 — 홈페이지에는 영향이 없습니다.";
  if (clip.stem.startsWith("artoke_"))
    note += "\nArtoke 동기화를 다시 하면 이 클립은 다시 받아집니다.";
  openConfirm("“" + clip.stem + "” 모션을 삭제할까요?", note, () => deleteClip(clip));
}

function openForgetFolderConfirm(folder) {
  openConfirm(
    "“" + folder + "” 를 최근 목록에서 지울까요?",
    "목록에서만 빠집니다 — 폴더와 그 안의 클립은 그대로입니다.\n" +
      "그 폴더를 다시 열면 목록에 다시 들어옵니다.",
    () => {
      forgetFolder(folder);
      setFolderListOpen(true);  // 여러 개를 이어서 정리할 수 있게 열어 둔다
      setStatus("최근 목록에서 뺐습니다: " + folder);
    },
    "목록에서 지우기"
  );
}

function deleteClip(clip) {
  if (clip.stem === state.selected) state.selected = null;
  if (!BRIDGE.obj || !clip.path) {
    // 목업: 화면에서만 지워 그룹 재배치를 확인한다
    state.clips = state.clips.filter((c) => c.stem !== clip.stem);
    renderGrid();
    setStatus("(목업) 삭제: " + clip.stem);
    return;
  }
  const folder = document.querySelector('[data-field="folder"]').value;
  bcall("delete_clip", JSON.stringify({ folder: folder, path: clip.path }), (res) => {
    if (res.ok) {
      setStatus("삭제: " + res.data.removed.join(", "), "ok");
      loadClipsFromBridge();
    } else setStatus(res.error, "error");
  });
}

grid.addEventListener("contextmenu", (e) => {
  const card = e.target.closest(".clip-card");
  if (!card) return;
  e.preventDefault();
  const clip = state.clips.find((c) => c.stem === card.dataset.stem);
  if (clip) openDeleteConfirm(clip);
});

/* 최근 폴더도 카드와 같은 몸짓으로 지운다 — 우클릭 후 확인. */
document.querySelector('[data-field="folder-list"]').addEventListener("contextmenu", (e) => {
  const entry = e.target.closest("button[data-folder]");
  if (!entry) return;
  e.preventDefault();
  openForgetFolderConfirm(entry.dataset.folder);
});

/* 상자 바깥 클릭 = 취소 */
confirmOverlay.addEventListener("click", (e) => {
  if (e.target === confirmOverlay) closeConfirm();
});

/* ---------- 타임라인 ---------- */
const timelineEl = document.querySelector(".timeline");
const trackEl = timelineEl.querySelector(".track");
const keptEl = timelineEl.querySelector(".kept");

function renderTimeline() {
  const [a, b] = state.trim;
  keptEl.style.left = (a * 100) + "%";
  keptEl.style.width = ((b - a) * 100) + "%";
  trackEl.querySelector('[data-side="start"]').style.left = (a * 100) + "%";
  trackEl.querySelector('[data-side="end"]').style.left = (b * 100) + "%";
  const ticks = timelineEl.querySelector(".ticks");
  ticks.innerHTML = "";
  for (let i = 0; i <= 4; i++) {
    const s = document.createElement("span");
    s.style.left = (i * 25) + "%";
    s.textContent = Math.round(i * 25) + "%";
    ticks.appendChild(s);
  }
}

trackEl.addEventListener("pointerdown", (e) => {
  const handle = e.target.closest(".trim-handle");
  if (!handle) return;
  const side = handle.dataset.side;
  handle.setPointerCapture(e.pointerId);       // 커서가 막대를 벗어나도 드래그 유지
  const MIN = 1 / 60;                          // 최소 한 프레임
  const onMove = (ev) => {
    const rect = trackEl.getBoundingClientRect();
    let v = (ev.clientX - rect.left) / rect.width;
    v = Math.min(1, Math.max(0, v));
    if (side === "start") state.trim[0] = Math.min(v, state.trim[1] - MIN);
    else                  state.trim[1] = Math.max(v, state.trim[0] + MIN);
    renderTimeline();
    setStatus("트림 " + Math.round(state.trim[0] * 100) + "% – " + Math.round(state.trim[1] * 100) + "%");
  };
  const onUp = () => {
    handle.removeEventListener("pointermove", onMove);
    handle.removeEventListener("pointerup", onUp);
  };
  handle.addEventListener("pointermove", onMove);
  handle.addEventListener("pointerup", onUp);
});

/* ---------- 곡선 보간 ----------
   제어점 사이를 직선이 아니라 모노톤 3차 스플라인(Fritsch–Butland PCHIP)으로
   잇는다. 베지어 핸들 없이도 DCC 곡선처럼 부드럽고, 제어점이 단조이면 곡선도
   단조가 수학적으로 보장된다 — 속도 곡선이 time_map 의 "감소 금지" 요구를
   오버슈트 없이 항상 만족한다는 뜻이다 (일반 캣멀롬은 여기서 튀어나온다). */
function pchipTangents(pts) {
  const n = pts.length, h = [], d = [];
  for (let i = 0; i < n - 1; i++) {
    h[i] = pts[i + 1][0] - pts[i][0];
    d[i] = h[i] ? (pts[i + 1][1] - pts[i][1]) / h[i] : 0;
  }
  const m = new Array(n);
  m[0] = d[0] || 0; m[n - 1] = d[n - 2] || 0;
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;      // 극점에서는 접선 0 (오버슈트 방지)
    else {
      const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1];
      m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
    }
  }
  return m;
}

function sampleCurve(pts, x) {
  if (pts.length < 2 || x <= pts[0][0]) return pts[0][1];
  if (x >= pts[pts.length - 1][0]) return pts[pts.length - 1][1];
  const m = pchipTangents(pts);
  let i = 0;
  while (x > pts[i + 1][0]) i++;
  const h = pts[i + 1][0] - pts[i][0];
  if (!h) return pts[i + 1][1];
  const t = (x - pts[i][0]) / h, t2 = t * t, t3 = t2 * t;
  return (2 * t3 - 3 * t2 + 1) * pts[i][1] + (t3 - 2 * t2 + t) * h * m[i]
       + (-2 * t3 + 3 * t2) * pts[i + 1][1] + (t3 - t2) * h * m[i + 1];
}

/* ---------- 곡선 패널 접기 ---------- */
const CURVES_OPEN_KEY = "bvhStudio.curvesOpen";
const curvePanel = document.querySelector(".curve-panel");

/* 접혀 있을 때 헤더에 걸어 둘 문구. 둘 다 임포트에 실제로 전달되므로 —
   속도는 time_map, 팔 간격은 ArmSpace 레이어 — 걸려 있으면 보여야 한다. */
function curveSummary() {
  const on = [];
  if (!speedCurveIsIdentity()) {
    on.push("속도 곡선 제어점 " + state.speedPoints.length + "개");
  }
  const armMax = Math.max(...state.armPoints.map((p) => p[1]));
  if (armMax > 0) on.push("팔 간격 " + Math.round(armMax * ARM_MAX_DEG) + "°");
  return on.length ? on.join(" · ") + " 적용 중" : "";
}

function renderCurvePanel() {
  const open = state.curvesOpen;
  curvePanel.dataset.open = open ? "1" : "0";
  curvePanel.querySelector(".curve-toggle").setAttribute("aria-expanded", String(open));
  // 펼쳐져 있으면 곡선 자체가 보이므로 요약은 접혔을 때만 띄운다.
  curvePanel.querySelector(".curve-summary").textContent = open ? "" : curveSummary();
}

function setCurvesOpen(open) {
  state.curvesOpen = open;
  try {
    localStorage.setItem(CURVES_OPEN_KEY, open ? "1" : "0");
  } catch (e) {
    /* 저장이 막혀 있어도 이번 세션 동안은 접힌 채로 쓸 수 있어야 한다 */
  }
  renderCurvePanel();
  // 펼치는 순간의 캔버스는 크기가 0 이었다 — 보이게 된 뒤에 다시 그린다.
  if (open) { drawSpeed(); drawArm(); }
}

/* ---------- 곡선 ---------- */
function curveSetup(el, points, opts) {
  const canvas = el.querySelector("canvas");
  let active = -1;                             // 드래그 중인 제어점 (피그마: 앰버 링)

  function draw() {
    const { ctx, w, h } = fitCanvas(canvas);
    ctx.clearRect(0, 0, w, h);
    const P = (p) => [p[0] * w, h - p[1] / opts.max * h];

    ctx.strokeStyle = "#141A21"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < 4; i++) {
      ctx.moveTo(0, h * i / 4); ctx.lineTo(w, h * i / 4);
      ctx.moveTo(w * i / 4, 0); ctx.lineTo(w * i / 4, h);
    }
    ctx.stroke();

    /* 피그마 모션 언어의 궤적 표기 — 점선 시안 */
    ctx.strokeStyle = "#48A9C5"; ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.setLineDash([1.5, 6]);
    ctx.beginPath();
    const x0 = points[0][0], x1 = points[points.length - 1][0];
    const STEPS = 72;                          // 스플라인을 촘촘히 샘플해 그린다
    for (let i = 0; i <= STEPS; i++) {
      const x = x0 + (x1 - x0) * i / STEPS;
      const s = P([x, sampleCurve(points, x)]);
      i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    points.forEach((p, i) => {
      const s = P(p);
      const isActive = i === active;
      ctx.fillStyle = isActive ? "#F5B642" : "#48A9C5";
      ctx.beginPath(); ctx.arc(s[0], s[1], 4, 0, Math.PI * 2); ctx.fill();
      if (isActive) {                          // 선택 링 (피그마: 드래그 보정 상태)
        ctx.strokeStyle = "#F5B642"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(s[0], s[1], 9, 0, Math.PI * 2); ctx.stroke();
      }
    });
  }

  canvas.addEventListener("pointerdown", (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    let idx = 0, best = Infinity;
    points.forEach((p, i) => { const d = Math.abs(p[0] - mx); if (d < best) { best = d; idx = i; } });
    if (best > 0.12) {                                    // 빈 곳을 누르면 제어점을 추가한다
      const my = (1 - (e.clientY - rect.top) / rect.height) * opts.max;
      idx = points.findIndex((p) => p[0] > mx);
      if (idx < 0) idx = points.length;
      points.splice(idx, 0, [mx, my]);
    }
    canvas.setPointerCapture(e.pointerId);
    const onMove = (ev) => {
      const r = canvas.getBoundingClientRect();
      let x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
      let y = Math.min(opts.max, Math.max(0, (1 - (ev.clientY - r.top) / r.height) * opts.max));
      // 단조성은 드래그 단계에서 이웃 값으로 클램프해 강제한다.
      // build_time_map 이 ValueError 를 던지기 전에 UI 에서 막는 것이다.
      if (idx > 0) x = Math.max(x, points[idx - 1][0]);
      if (idx < points.length - 1) x = Math.min(x, points[idx + 1][0]);
      if (opts.monotoneY) {
        if (idx > 0) y = Math.max(y, points[idx - 1][1]);
        if (idx < points.length - 1) y = Math.min(y, points[idx + 1][1]);
      }
      if (idx === 0) x = 0;
      if (idx === points.length - 1) x = Math.max(x, 0.05);
      points[idx] = [x, y];
      draw();
      renderCurvePanel();
      setStatus(opts.label + " 제어점 " + points.length + "개");
    };
    const onUp = () => {
      canvas.removeEventListener("pointermove", onMove);
      canvas.removeEventListener("pointerup", onUp);
      active = -1;
      draw();
    };
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    active = idx;
    draw();
  });

  /* 우클릭 = 제어점 삭제 (DCC 관례). 양 끝점은 곡선의 앵커라 지울 수 없다. */
  canvas.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) / rect.width;
    const my = (1 - (e.clientY - rect.top) / rect.height) * opts.max;
    let idx = -1, best = Infinity;
    points.forEach((p, i) => {
      const d = Math.hypot(p[0] - mx, (p[1] - my) / opts.max);
      if (d < best) { best = d; idx = i; }
    });
    if (idx <= 0 || idx >= points.length - 1) {
      setStatus("양 끝점은 지울 수 없습니다");
      return;
    }
    if (best > 0.08) return;                   // 점 근처가 아니면 무시
    points.splice(idx, 1);
    draw();
    renderCurvePanel();
    setStatus(opts.label + " 제어점 삭제 — " + points.length + "개 (우클릭=삭제)");
  });

  return draw;
}

const drawSpeed = curveSetup(document.querySelector('.curve[data-kind="speed"]'),
  state.speedPoints, { max: 1, monotoneY: true, label: "속도 곡선" });
const drawArm = curveSetup(document.querySelector('.curve[data-kind="armspace"]'),
  state.armPoints, { max: 1, monotoneY: false, label: "팔 간격 곡선" });

/* ---------- 버튼 ---------- */
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const action = btn.dataset.action;
  if (action === "azimuth") {
    state.azimuth = Number(btn.dataset.deg);
    setStatus("방위각 " + state.azimuth + "°");
  } else if (action === "folder-history") {
    setFolderListOpen(document.querySelector('[data-field="folder-list"]').hidden);
  } else if (action === "refresh") {
    state.poseCache.clear();
    if (BRIDGE.obj) loadClipsFromBridge();
    else { renderGrid(); setStatus("새로고침했습니다."); }
  } else if (action === "sync") {
    if (!BRIDGE.obj) { setStatus("(목업) 동기화는 Max 안에서 동작합니다."); return; }
    setStatus("Artoke 모션 동기화 중…");
    bcall("sync_from_artoke", document.querySelector('[data-field="folder"]').value, (res) => {
      if (!res.ok) { setStatus(res.error, "error"); return; }
      const got = res.data.downloaded;
      const warning = res.data.phase_warning;
      setStatus(
        (got.length ? "Artoke 다운로드: " + got.join(", ") : "최신 상태 — 새 모션 없음") +
          (warning ? " / " + warning : ""),
        warning ? "error" : "ok",
      );
      if (got.length) loadClipsFromBridge();
      /* 모션이 그대로여도 phase.json 은 방금 받았을 수 있다 — 블렌드가 열리는
         조건이 바뀌므로 다운로드 여부와 무관하게 다시 확인한다. */
      state.folder = document.querySelector('[data-field="folder"]').value;
      refreshBlendTiers();
    });
  } else if (action === "add-video") {
    addVideo();
  } else if (action === "cancel-video") {
    if (!state.videoJob) return;
    bcall("cancel_video_job", state.videoJob.id, (res) => {
      if (res.ok) showVideoJob(res.data);
      setStatus(res.ok ? "영상 변환을 취소했습니다." : res.error, res.ok ? "" : "error");
    });
  } else if (action === "import") {
    if (!state.selected) { setStatus("클립을 먼저 고르세요.", "error"); return; }
    const clip = state.clips.find((c) => c.stem === state.selected);
    if (!BRIDGE.obj || !clip || !clip.path) {
      setStatus("(목업) 임포트는 Max 안에서 동작합니다 — 브라우저에서는 미리보기만.", "error");
      return;
    }
    const data = poseFor(state.selected);
    const extras = { trim_start: state.trim[0], trim_end: state.trim[1] };
    const timeMap = timeMapFromCurve(data);
    if (timeMap) extras.time_map = timeMap;
    const armKeys = armKeysFromCurve(data, timeMap);
    if (armKeys) extras.arm_points = armKeys;
    importPath(clip.path, clip.stem, extras);
  } else if (action === "blend-import") {
    if (!BRIDGE.obj) { setStatus("(목업) 블렌드 임포트는 Max 안에서 동작합니다.", "error"); return; }
    if (!state.blendTiers.length) { setStatus("8방향 세트가 없습니다 — 먼저 동기화하세요.", "error"); return; }
    const deg = state.blendAngle;
    setStatus("굳히는 중… (" + deg + "°)");
    setBlendBusy(true);
    bcall(
      "bake_blend",
      JSON.stringify({ folder: state.folder, angle: deg, speed_t: state.blendSpeed }),
      (res) => {
        setBlendBusy(false);
        if (!res.ok) { setStatus(res.error, "error"); return; }
        /* 트림과 커브는 넘기지 않는다: 6초 소스 타임라인에 대해 만든 값이라 한
           보행 사이클(0.5~1.3초)짜리 결과에 걸면 대부분을 잘라낸다. convert·미러·
           대상·이름·배치 간격은 그대로 따라간다. */
        const speed = res.data.metresPerSecond;
        importPath(
          res.data.path,
          "blend_" + String(deg).padStart(3, "0") + "deg",
          {},
          "블렌드 " + deg + "° · " + (speed == null ? "?" : speed.toFixed(1)) + " m/s · " +
            res.data.frames + "프레임",
        );
      },
    );
  } else if (action === "blend-preview") {
    if (!BRIDGE.obj) { setStatus("(목업) 블렌드 검수는 Max 안에서 브라우저를 엽니다."); return; }
    bcall("open_external", "https://artoke.com/viewer?blend=locomotion", (res) => {
      setStatus(res.ok ? "브라우저에서 블렌드 검수를 열었습니다." : res.error, res.ok ? "ok" : "error");
    });
  } else if (action === "toggle-curves") {
    setCurvesOpen(!state.curvesOpen);
  } else if (action === "confirm-cancel") {
    closeConfirm();
  } else if (action === "confirm-delete") {
    const pending = state.pendingConfirm;
    closeConfirm();
    if (pending) pending.run();
  } else if (action === "mixer") {
    if (!BRIDGE.obj) { setStatus("(목업) Motion Mixer 전송"); return; }
    const sel = document.querySelector('[data-field="biped"]');
    if (!sel.value) { setStatus("바이패드를 선택하세요", "error"); return; }
    const clipsDir = document.querySelector('[data-field="folder"]').value + "\\clips";
    bcall("send_to_mixer", JSON.stringify({ biped: sel.value, clips_dir: clipsDir }), (res) => {
      setStatus(res.ok ? res.data.message : res.error, res.ok ? "ok" : "error");
    });
  }
});

document.querySelector('[data-field="search"]').addEventListener("input", () => {
  // 칩도 같이 다시 그린다 — 숫자가 검색 결과를 따라가야 하고, 선반이 풀렸다면
  // 그 사실이 보여야 한다.
  widenIfShelfHasNoMatch();
  renderShelfChips();
  renderGrid();
});
/* 세 줄을 감싼 곳에서 한 번에 받는다. 위 단계를 바꾸면 아래 단계는 푼다 —
   "공격>돌진>시작" 을 보다가 "이동" 으로 옮겼는데 돌진/시작이 남아 있으면
   아무것도 안 나오고, 왜 비었는지는 화면에 안 적혀 있다. */
document.querySelector('[data-field="folder-list"]').addEventListener("click", (e) => {
  const picked = e.target.closest("button[data-folder]");
  if (!picked) return;
  document.querySelector('[data-field="folder"]').value = picked.dataset.folder;
  setFolderListOpen(false);
  // 고르는 것과 여는 것을 나누지 않는다 — 고르고 나서 새로고침을 또 눌러야 하면
  // 목록에서 고른 의미가 없다.
  if (BRIDGE.obj) loadClipsFromBridge();
  else setStatus("Max 브리지가 없어 폴더만 바꿨습니다: " + picked.dataset.folder);
});

// 바깥을 누르거나 Esc 로 닫는다. 열어 두면 그리드를 가린다.
// 확인 상자 안의 클릭은 바깥이 아니다 — 목록에서 항목을 지우는 중이라 뒤의
// 목록이 접히면 여러 개를 이어서 정리할 수 없다.
document.addEventListener("click", (e) => {
  if (e.target.closest(".folder-field") || e.target.closest(".confirm-overlay")) return;
  setFolderListOpen(false);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  // 모달이 떠 있으면 그것만 닫는다. 뒤의 목록까지 같이 접으면 다시 열어야 한다.
  if (state.pendingConfirm) { closeConfirm(); return; }
  setFolderListOpen(false);
});

document.querySelector(".shelf-chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".cat-chip");
  if (!chip) return;
  const field = chip.closest("[data-field]").dataset.field;
  if (field === "category") {
    state.category = chip.dataset.value;
    state.sub = "";
    state.detail = "";
  } else if (field === "sub") {
    state.sub = chip.dataset.value;
    state.detail = "";
  } else {
    state.detail = chip.dataset.value;
  }
  renderShelfChips();
  renderGrid();
});
document.querySelector('[data-field="target"]').addEventListener("change", updateImportButton);

document.querySelector('[data-field="blend-angle"]').addEventListener("input", (e) => {
  state.blendAngle = Number(e.target.value);
  document.querySelector('[data-out="blend-angle"]').textContent = state.blendAngle + "°";
});
document.querySelector('[data-field="blend-speed"]').addEventListener("input", (e) => {
  state.blendSpeed = Number(e.target.value);
  document.querySelector('[data-out="blend-speed"]').textContent = blendSpeedLabel();
});

/* ---------- 시작 ---------- */
state.clips = DUMMY_CLIPS;
state.categories = DUMMY_CATEGORIES;
renderShelfChips();
renderGrid();
renderTimeline();
drawSpeed();
drawArm();
renderCurvePanel();
renderBlendControls();
window.addEventListener("resize", () => { renderTimeline(); drawSpeed(); drawArm(); });

/* 마지막으로 열었던 폴더로 시작한다. 매번 기본 폴더로 돌아가면 다른 폴더에서
   일하던 사람은 창을 열 때마다 경로를 다시 쳐야 한다 — 브리지가 붙는 즉시 이
   값으로 읽으므로, 하던 자리에서 이어진다. */
const lastFolder = folderHistory()[0];
if (lastFolder) document.querySelector('[data-field="folder"]').value = lastFolder;

if (!connectBridge())
  setStatus("더미 데이터로 동작 중입니다 — Max 브리지 없음. 클립을 고르세요.");
</script>
</body>
</html>
